    const supabaseClient =
        window.supabase.createClient(

        );


    const params =
        new URLSearchParams(

    function escapeHtml(value) {

        return String(value || "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

    }


    async function loadCourse() {

        try {

            const {
                data: {
                    session
                },
                error: sessionError
            } = await supabaseClient.auth.getSession();


            if (sessionError) {
                throw sessionError;
            }


            if (!session) {

                window.location.href =
                    "login.html";

            }


            if (!COURSE_ID) {

                throw new Error(

                );

            }
const user =
    session.user;


const {
    data: enrollment,
    error: enrollmentError
} = await supabaseClient

    )

if (enrollmentError) {

}


if (!enrollment) {

    );

    window.location.href =
        "courses.html";

}

            const {

            } = await supabaseClient

                    description
                `)

                )

                )

            if (courseError) {

            document.getElementById(

            const {

            } = await supabaseClient

                    id,

                    description,
                    module_order
                `)

                    "course_id",
                    COURSE_ID
                )
                .order(
                    "module_order",

                        ascending: true
                    }

            if (modulesError) {
                throw modulesError;

            const container =

           if (

) {

    container.innerHTML = `

    return;

}

            for (

                const {

                        id,

                    `)

>

</button>

    async function markLessonComplete(lessonId, button) {

    try {

        const {
            data: {
                session
            },
            error: sessionError
        } = await supabaseClient.auth.getSession();

        if (sessionError) {
            throw sessionError;
        }

        if (!session) {

            window.location.href = "login.html";
            return;

        }

        const user = session.user;

        const {
            error
        } = await supabaseClient
            .from("lesson_progress")
            .insert({
                user_id: user.id,
                lesson_id: lessonId
            });

        if (error) {

            if (error.code === "23505") {

                button.textContent =
                    "✓ Lesson Completed";

                button.disabled = true;

                return;

            }

            throw error;

        }

        button.textContent =
            "✓ Lesson Completed";

        button.disabled = true;

        alert(
            "✓ Lesson completed successfully!"
        );

    }

    catch (error) {

        console.error(
            "Lesson completion error:",
            error
        );

        alert(
            "Unable to save lesson completion. Please try again."
        );

    }

}
    async function updateCourseProgress() {

    try {

        const {
            data: {
                session
            },
            error: sessionError
        } = await supabaseClient.auth.getSession();

        if (sessionError) {
            throw sessionError;
        }

        if (!session) {
            return;
        }

        const user = session.user;

        const {
            data: modules,
            error: modulesError
        } = await supabaseClient
            .from("course_modules")
            .select("id")
            .eq("course_id", COURSE_ID);

        if (modulesError) {
            throw modulesError;
        }

        if (!modules || modules.length === 0) {
            return;
        }

        const moduleIds =
            modules.map(function(module) {
                return module.id;
            });

        const {
            data: lessons,
            error: lessonsError
        } = await supabaseClient
            .from("lessons")
            .select("id")
            .in("module_id", moduleIds)
            .eq("is_published", true);

        if (lessonsError) {
            throw lessonsError;
        }

        const totalLessons =
            lessons ? lessons.length : 0;

        if (totalLessons === 0) {
            return;
        }

        const lessonIds =
            lessons.map(function(lesson) {
                return lesson.id;
            });

        const {
            data: completedLessons,
            error: progressError
        } = await supabaseClient
            .from("lesson_progress")
            .select("lesson_id")
            .eq("user_id", user.id)
            .in("lesson_id", lessonIds);

        if (progressError) {
            throw progressError;
        }

        const completedCount =
            completedLessons
                ? completedLessons.length
                : 0;

        const percentage =
            Math.round(
                (completedCount / totalLessons) * 100
            );

        document.getElementById(
            "progressPercentage"
        ).textContent =
            percentage + "%";

        document.getElementById(
            "progressBar"
        ).style.width =
            percentage + "%";

        document.getElementById(
            "progressText"
        ).textContent =
            completedCount +
            " of " +
            totalLessons +
            " lessons completed";

    }

    catch (error) {

        console.error(
            "Course progress error:",
            error
        );

    }

}
    async function loadCompletedLessons() {

    try {

        const {

                session
            },

        } = await supabaseClient.auth.getSession();

        if (error) {
            throw error;
        }

        if (!completedLessons) {
            return;
        }

        completedLessons.forEach(function(progress) {

            const button =
                document.querySelector(
                    `.complete-btn[data-lesson-id="${progress.lesson_id}"]`
                );

           if (button) {

    button.textContent =
        "✓ Lesson Completed";

    button.disabled = true;

    updateCourseProgress();

}
        });

    }

    catch (error) {

        console.error(
            "Completed lessons loading error:",
            error
        );

    }

}
  loadCourse()

        return loadCompletedLessons();
    })
    .then(function() {
        updateCourseProgress();
    });
