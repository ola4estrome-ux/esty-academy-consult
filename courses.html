    <title>My Courses | Esty Academy Consult</title>

    <style>

        * {

<body>


<header>

    <div>

        <div class="brand">
            ESTY ACADEMY CONSULT
        </div>

        <div class="tagline">
            Empowering People. Building Businesses. Transforming Lives.
        </div>

    </div>


    <a
        href="dashboard.html"
        class="back-btn"
    >
        ← Dashboard
    </a>

</header>


<main class="container">


    <div
        id="message"
        class="message"
    ></div>


    <section class="page-header">

        <h1>
            🎓 My Courses
        </h1>

        <p>
            Explore available courses and begin your learning journey
            with Esty Academy Consult.
        </p>

    </section>


    <div
        id="coursesContainer"
        class="courses-grid"
    >

        <div class="loading">
            Loading courses...
        </div>

    </div>


</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

    const SUPABASE_URL =
        "https://tsrxkifpkzjaibyujyhk.supabase.co";


    const SUPABASE_PUBLISHABLE_KEY =
        "sb_publishable_dFqg9KQcLeBbz7Nww04KEQ_XB_v38c4";


    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY
        );


    function escapeHtml(value) {

        return String(value || "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

    }


    function showError(text) {

        const message =
            document.getElementById(
                "message"
            );

        message.style.display =
            "block";

        message.textContent =
            text;

    }


    async function loadCourses() {

        try {

            const {
                data: {
                    session
                },
                error: sessionError
            } = await supabaseClient.auth.getSession();


            if (sessionError) {
                throw sessionError;
            }


            if (!session) {

                window.location.href =
                    "login.html";

                return;

            }


            const {
                data: courses,
                error: coursesError
            } = await supabaseClient
                .from("courses")
                .select(`
                    id,
                    title,
                    description
                `)
                .eq(
                    "is_published",
                    true
                )
                .order(
                    "created_at",
                    {
                        ascending: false
                    }
                );


            if (coursesError) {
                throw coursesError;
            }


            const container =
                document.getElementById(
                    "coursesContainer"
                );


            container.innerHTML = "";


            if (
                !courses ||
                courses.length === 0
            ) {

                container.innerHTML = `
                    <div class="empty">
                        <h2>
                            No published courses yet
                        </h2>

                        <p>
                            Courses will appear here when
                            they are published.
                        </p>
                    </div>
                `;

                return;

            }


            courses.forEach(
                function(course) {

                    const card =
                        document.createElement(
                            "article"
                        );

                    card.className =
                        "course-card";


                    card.innerHTML = `

                        <div class="course-icon">
                            🎓
                        </div>

                        <h2>
                            ${escapeHtml(
                                course.title
                            )}
                        </h2>

                        <p>
                            ${escapeHtml(
                                course.description ||
                                "Explore this course and begin learning."
                            )}
                        </p>

                        <a
                            class="course-btn"
                            href="course.html?course=${encodeURIComponent(
                                course.id
                            )}"
                        >
                            Open Course →
                        </a>

                    `;


                    container.appendChild(
                        card
                    );

                }
            );

        }

        catch (error) {

            console.error(
                "Course catalogue error:",
                error
            );

            showError(
                "Unable to load your courses. Please try again."
            );

            document.getElementById(
                "coursesContainer"
            ).innerHTML = "";

        }

    }


    loadCourses();

</script>


</body>

</html>
